name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API (lint and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: cloudops-ci
          POSTGRES_DB: cloudops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudops -d cloudops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cloudops:cloudops-ci@127.0.0.1:5432/cloudops_test
      TEST_DATABASE_URL: postgresql+psycopg://cloudops:cloudops-ci@127.0.0.1:5432/cloudops_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Check migrations match models
        run: alembic check

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: API (Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t cloudops-api:ci services/api

      - name: Smoke test
        run: |
          docker run -d --name cloudops-api -p 8000:8000 cloudops-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          docker logs cloudops-api
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs cloudops-api || true
